<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
  <title id="title">Before splitting load_test_input.psv</title>
  <desc id="description">A terminal-style view of one pipe-delimited source file containing five data records.</desc>
  <rect width="1000" height="420" fill="#0d1117"/>
  <rect x="30" y="30" width="940" height="360" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="60" cy="60" r="8" fill="#ff5f57"/>
  <circle cx="85" cy="60" r="8" fill="#febc2e"/>
  <circle cx="110" cy="60" r="8" fill="#28c840"/>
  <text x="140" y="66" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">load_test_input.psv - before splitting</text>
  <text x="65" y="120" fill="#8b949e" font-family="Consolas, monospace" font-size="18">5 logical data records</text>
  <text x="65" y="170" fill="#7ee787" font-family="Consolas, monospace" font-size="21">order_id|region|amount</text>
  <text x="65" y="210" fill="#c9d1d9" font-family="Consolas, monospace" font-size="21">1001|East|1250.00</text>
  <text x="65" y="245" fill="#c9d1d9" font-family="Consolas, monospace" font-size="21">1002|West|980.50</text>
  <text x="65" y="280" fill="#c9d1d9" font-family="Consolas, monospace" font-size="21">1003|North|1425.75</text>
  <text x="65" y="315" fill="#c9d1d9" font-family="Consolas, monospace" font-size="21">1004|South|760.25</text>
  <text x="65" y="350" fill="#c9d1d9" font-family="Consolas, monospace" font-size="21">1005|East|1100.00</text>
</svg>
