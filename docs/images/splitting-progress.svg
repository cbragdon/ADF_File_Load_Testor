<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title description">
  <title id="title">Splitter progress for a five-record pipe-delimited file</title>
  <desc id="description">A terminal-style view of the split command reporting five source records, three parts, a 2 2 1 distribution, and successful validation.</desc>
  <rect width="1000" height="500" fill="#0d1117"/>
  <rect x="30" y="30" width="940" height="440" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="60" cy="60" r="8" fill="#ff5f57"/>
  <circle cx="85" cy="60" r="8" fill="#febc2e"/>
  <circle cx="110" cy="60" r="8" fill="#28c840"/>
  <text x="140" y="66" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">split_delimited_file.py - progress</text>
  <text x="65" y="120" fill="#7ee787" font-family="Consolas, monospace" font-size="17">&gt; python .\scripts\split_delimited_file.py .\data\load_test_input.psv --parts 3</text>
  <text x="65" y="170" fill="#c9d1d9" font-family="Consolas, monospace" font-size="19">Logical data records: 5</text>
  <text x="65" y="205" fill="#c9d1d9" font-family="Consolas, monospace" font-size="19">Parts: 3</text>
  <text x="65" y="240" fill="#c9d1d9" font-family="Consolas, monospace" font-size="19">Planned counts: [2, 2, 1]</text>
  <text x="65" y="295" fill="#58a6ff" font-family="Consolas, monospace" font-size="18">load_test_input_part_01_of_03.psv: 2 records</text>
  <text x="65" y="330" fill="#58a6ff" font-family="Consolas, monospace" font-size="18">load_test_input_part_02_of_03.psv: 2 records</text>
  <text x="65" y="365" fill="#58a6ff" font-family="Consolas, monospace" font-size="18">load_test_input_part_03_of_03.psv: 1 records</text>
  <text x="65" y="425" fill="#7ee787" font-family="Consolas, monospace" font-size="18">Validated: wrote 5 of 5 records across exactly 3 files</text>
</svg>
