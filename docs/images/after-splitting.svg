  <text x="100" y="230" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">1002|West|980.50</text>
  <text x="65" y="285" fill="#58a6ff" font-family="Consolas, monospace" font-size="19">load_test_input_part_02_of_03.psv</text>
  <text x="100" y="320" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">1003|North|1425.75</text>
  <text x="100" y="350" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">1004|South|760.25</text>
  <text x="65" y="405" fill="#58a6ff" font-family="Consolas, monospace" font-size="19">load_test_input_part_03_of_03.psv</text>
  <text x="100" y="440" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">1005|East|1100.00</text>
</svg>
