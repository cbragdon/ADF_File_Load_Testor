<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title description">
  <title id="title">After splitting load_test_input.psv into three files</title>
  <desc id="description">A terminal-style view showing three generated files with record counts of two, two, and one.</desc>
  <rect width="1000" height="500" fill="#0d1117"/>
  <rect x="30" y="30" width="940" height="440" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="60" cy="60" r="8" fill="#ff5f57"/>
  <circle cx="85" cy="60" r="8" fill="#febc2e"/>
  <circle cx="110" cy="60" r="8" fill="#28c840"/>
  <text x="140" y="66" fill="#c9d1d9" font-family="Consolas, monospace" font-size="18">split_output - after splitting</text>
  <text x="65" y="115" fill="#8b949e" font-family="Consolas, monospace" font-size="18">Parts: 3    Planned counts: [2, 2, 1]</text>
  <text x="65" y="165" fill="#58a6ff" font-family="Consolas, monospace" font-size="19">load_test_input_part_01_of_03.psv</text>
